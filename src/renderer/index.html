<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AuraPad</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         'wasm-unsafe-eval' + the huggingface hosts exist for the voice
         features: onnxruntime's wasm backend, and the one-time Whisper/Piper
         model downloads (huggingface.co redirects to its
         cdn-lfs.huggingface.co / cas-bridge.xethub.hf.co CDNs).
         media-src blob: lets read-aloud play the synthesized wav chunks. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
