appId: com.struchev.aurapad
productName: AuraPad
# Where electron-updater looks for new versions (latest*.yml + artifacts).
# With this set, the CI release build also uploads those metadata files.
publish:
  provider: github
  owner: roman-struchev
  repo: aura-pad
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,AUDIT.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.node.tsbuildinfo}'
  - '!{docs,.claude,.idea,.github}/**'
  - '!{tailwind.config.js,postcss.config.js}'
  # node-pty's own source/build scaffolding - only the prebuilt native addon
  # under prebuilds/ is ever loaded at runtime.
  - '!node_modules/node-pty/{src,deps,third_party,scripts}/**'
asarUnpack:
  - resources/**
# Registers AuraPad as an "Open With..." option for plain text-ish files
# (macOS, Windows, and Linux all read this same list). `role: Editor` marks
# it as an editor rather than the sole viewer, so it shows up alongside
# whatever else can already open these files instead of trying to take over
# as the default. Only takes effect in a packaged build - `npm run dev`
# doesn't register anything with the OS.
fileAssociations:
  - ext: txt
    name: Plain Text
    role: Editor
  - ext: md
    name: Markdown
    role: Editor
  - ext: json
    name: JSON
    role: Editor
  - ext: log
    name: Log File
    role: Editor
  - ext: yml
    name: YAML
    role: Editor
  - ext: yaml
    name: YAML
    role: Editor
  - ext: conf
    name: Config File
    role: Editor
  - ext: ini
    name: INI Config
    role: Editor
  - ext: cfg
    name: Config File
    role: Editor
  - ext: toml
    name: TOML
    role: Editor
  - ext: env
    name: Env File
    role: Editor
  - ext: properties
    name: Properties File
    role: Editor
  - ext: xml
    name: XML
    role: Editor
  - ext: csv
    name: CSV
    role: Editor
  - ext: sh
    name: Shell Script
    role: Editor
win:
  executableName: aurapad
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
