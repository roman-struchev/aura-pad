version: '3.7'

services:
  aura-server:
    image: 'romanew/all:aura-server'
    container_name: aura-server
    network_mode: host
    environment:
      - server.port=${PORT:-10005}
      - WORKTOGETHER_TOKEN_SECRET=${WORKTOGETHER_TOKEN_SECRET:-}
      # Share links always point here, whatever Host header cloudflared passes on.
      - WORKTOGETHER_PUBLIC_BASE_URL=https://aura-pad.struchev.com
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
