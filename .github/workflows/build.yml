name: Build/Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-draft:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          # Full history + tags, to list the commits since the previous release.
          fetch-depth: 0

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Nearest tag reachable from the commit *before* this release's own
          # tag - i.e. the previous release. Empty on the very first release.
          PREV_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            if [ -n "$PREV_TAG" ]; then
              # The version-bump commits ("release vX.Y.Z") are noise, not changes.
              git log --no-merges --pretty='- %s' "$PREV_TAG..$TAG" | grep -v '^- release v' || true
              echo
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
            else
              git log --no-merges --pretty='- %s' "$TAG" | grep -v '^- release v' || true
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --draft --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

  build:
    needs: create-draft
    if: always() && (needs.create-draft.result == 'success' || needs.create-draft.result == 'skipped')
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest]
#        os: [macos-latest, ubuntu-latest, windows-latest]

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build and Release Electron App
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          max_attempts: 3

  publish:
    needs: [create-draft, build]
    if: always() && needs.create-draft.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Publish Draft Release
        run: gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
