name: Server build/deploy

# The Work Together backend lives in server/. Only changes there (or to this
# file) rebuild and redeploy it; the Electron app has its own build.yml.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Test and build jar
        run: ./gradlew test bootJar

      - name: Publish to Registry
        uses: elgohr/Publish-Docker-Github-Action@master
        with:
          name: romanew/all
          tags: aura-server
          workdir: server
          username: ${{ secrets.DOCKER_PUBLISH_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_PUBLISH_REGISTRY_PASSWORD }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          host: 31.186.136.15
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY_PERSONAL }}
          source: server/docker-compose.yml
          strip_components: 1
          target: ~/aura-server/

      - name: Start using docker-compose
        uses: appleboy/ssh-action@master
        with:
          host: 31.186.136.15
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY_PERSONAL }}
          script: |
            cd aura-server
            export PORT="10005"
            docker compose down
            docker compose pull
            docker compose up -d
